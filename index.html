<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสแกนสินค้าบันทึกเข้า Google Sheets</title>
  <!-- HTML5 QR Code Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: 'Sarabun', Arial, sans-serif; background-color: #f4f6f9; padding: 20px; margin: 0; }
    .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1e293b; margin-top: 0; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; color: #334155; }
    input, select, button { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
    button { background-color: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #1d4ed8; }
    .status { text-align: center; font-weight: bold; margin-top: 15px; padding: 10px; border-radius: 6px; display: none; }
    .status.success { background: #dcfce7; color: #166534; display: block; }
    .status.error { background: #fee2e2; color: #991b1b; display: block; }
    .status.loading { background: #e0f2fe; color: #075985; display: block; }
  </style>
</head>
<body>

<div class="container">
  <h2>📦 ระบบสแกนสต็อกคลังสินค้า</h2>

  <!-- กล้องสแกน -->
  <div id="reader"></div>

  <!-- ฟอร์มแสดงและกรอกข้อมูล -->
  <form id="stockForm">
    <div class="form-group">
      <label for="barcode">รหัสสินค้า / QR Code:</label>
      <input type="text" id="barcode" placeholder="ผลการสแกนจะแสดงตรงนี้" required readonly>
    </div>

    <div class="form-group">
      <label for="action">ประเภทรายการ:</label>
      <select id="action">
        <option value="INBOUND (รับเข้า)">📥 รับสินค้าเข้า (IN)</option>
        <option value="OUTBOUND (จ่ายออก)">📤 จ่ายสินค้าออก (OUT)</option>
        <option value="COUNT (ตรวจนับ)">🔍 ตรวจนับสต็อก (CHECK)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="quantity">จำนวน:</label>
      <input type="number" id="quantity" value="1" min="1" required>
    </div>

    <div class="form-group">
      <label for="location">ตำแหน่งชั้นวาง (Bin/Rack):</label>
      <input type="text" id="location" placeholder="เช่น A-01-02" value="A-01-01">
    </div>

    <button type="submit" id="submitBtn">บันทึกลง Google Sheets</button>
  </form>

  <div id="statusBox" class="status"></div>
</div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwOqznuNpdWpX7nyY7el_Z_u1Fmb1VtH6fYOKBb903ukTxDfPGRA3htzOFmBhLQwj95nw/exec";

  let lastScannedCode = "";

  // ฟังก์ชันเมื่อสแกนสำเร็จ
  function onScanSuccess(decodedText, decodedResult) {
    if (decodedText !== lastScannedCode) {
      lastScannedCode = decodedText;
      document.getElementById('barcode').value = decodedText;
      if (navigator.vibrate) navigator.vibrate(100); // สั่นเตือนเมื่อสแกนติด
      showStatus("สแกนสำเร็จ! ตรวจสอบข้อมูลแล้วกดบันทึก", "success");
    }
  }

  // เรียกใช้งานกล้อง
  let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } });
  html5QrcodeScanner.render(onScanSuccess);

  // ส่งข้อมูลลง Google Sheets
  document.getElementById('stockForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const barcode = document.getElementById('barcode').value;
    if (!barcode) {
      showStatus("กรุณาสแกนรหัสสินค้าก่อน", "error");
      return;
    }

    const payload = {
      barcode: barcode,
      action: document.getElementById('action').value,
      quantity: document.getElementById('quantity').value,
      location: document.getElementById('location').value
    };

    showStatus("กำลังส่งข้อมูลลง Google Sheets...", "loading");
    document.getElementById('submitBtn').disabled = true;

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      showStatus("บันทึกข้อมูลสำเร็จแล้ว! ✅", "success");
      // ล้างค่าเพื่อให้สแกนชิ้นต่อไปได้ทันที
      document.getElementById('barcode').value = "";
      document.getElementById('quantity').value = "1";
      lastScannedCode = "";
      document.getElementById('submitBtn').disabled = false;
    })
    .catch(error => {
      console.error('Error:', error);
      showStatus("เกิดข้อผิดพลาดในการบันทึก", "error");
      document.getElementById('submitBtn').disabled = false;
    });
  });

  function showStatus(text, type) {
    const box = document.getElementById('statusBox');
    box.innerText = text;
    box.className = "status " + type;
  }
</script>

</body>
</html>
